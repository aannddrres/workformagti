spring:
  application:
    name: portal-backend

server:
  port: 8080

# Mirrors config.py's Settings class -- same env var names, same
# insecure-but-workable local defaults, so a real deployment overrides them
# the same way the Python app expects. See portal.security.jwt.secret's
# comment for the production footgun this default is meant to avoid.
portal:
  app-env: ${APP_ENV:development}
  security:
    jwt:
      # NEVER ship this default to production -- config.py's startup guard
      # (config.py:121-124) refuses to boot if this exact string is still
      # set with APP_ENV=production; no Java equivalent exists yet (todo).
      secret: ${SECRET_KEY:super-secret-temporary-key-for-local-development}
      algorithm: ${JWT_ALGORITHM:HS256}
      access-token-expire-minutes: ${ACCESS_TOKEN_EXPIRE_MINUTES:60}
    cookie:
      secure: ${COOKIE_SECURE:false}
      samesite: ${COOKIE_SAMESITE:lax}
