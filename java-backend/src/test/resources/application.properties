# Test-only overrides.
#
# Spring Boot loads application.properties in addition to application.yml and
# gives .properties precedence for overlapping keys, so this ADDS to the main
# application.yml rather than shadowing it -- the datasource, Flyway and JPA
# config all still come from there. (A src/test/resources/application.yml
# would shadow the main file entirely and take the database config with it.)
#
# Why these two keys:
#
# portal.app-env now defaults to production so a missing APP_ENV fails safe
# (SEC-01). Under that default ProductionSafetyGuard would refuse to boot any
# @SpringBootTest, because the suite legitimately runs with the shipped dev
# JWT secret and cookie-secure=false. Tests are a development environment and
# say so explicitly, which is exactly the posture the fix asks of every other
# non-production deployment.
#
# allow-dev-login is on because the suite exercises that path on purpose:
# AuthControllerIntegrationTest:49-52 logs in as content@magti.ge with the
# password "anything" and asserts a token comes back. Turning it off here
# would not make the tests safer, it would delete the coverage of the bypass.
#
# The production defaults themselves are asserted by ProductionSafetyGuardTest
# and AuthenticationServiceTest, neither of which boots a context, so nothing
# here can weaken those assertions.
portal.app-env=development
portal.security.allow-dev-login=true
