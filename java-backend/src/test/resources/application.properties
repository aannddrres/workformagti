# Test-run configuration. Only sets which profile the tests boot under --
# every actual value still comes from application.yml + application-dev.yml,
# so this file cannot mask a change to the shipped defaults.
#
# Needed since audit OPUS5 SEC-01 flipped application.yml's defaults to
# production-safe: the integration tests log in as content@magti.ge with
# password "anything" (AuthControllerIntegrationTest:47-56) and talk to the
# local dev Oracle, both of which are now explicit dev-profile behaviour.
#
# DefaultSecurityPostureTest deliberately reads application.yml directly,
# WITHOUT this profile, so the shipped defaults stay under test.
spring.profiles.active=dev
