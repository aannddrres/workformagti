<div class="flex flex-col gap-4">
  @for (question of questions(); track $index; let qi = $index) {
    <div class="rounded-md border border-slate-200 bg-white p-3 dark:border-slate-700 dark:bg-slate-900">
      <div class="flex items-start gap-2">
        <textarea
          rows="2"
          class="flex-1 rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-brand-accent focus:outline-none focus:ring-1 focus:ring-brand-accent dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100"
          [placeholder]="'content.quiz.question_placeholder' | translate"
          [value]="question.question_text"
          (input)="updateQuestionText(qi, $any($event.target).value)"
        ></textarea>
        <button
          type="button"
          class="mt-1 text-slate-600 dark:text-slate-400 hover:text-brand-accent"
          [attr.aria-label]="'content.quiz.remove_question' | translate"
          (click)="removeQuestion(qi)"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="mt-2 space-y-1.5">
        @for (answer of question.answers; track $index; let ai = $index) {
          <div class="flex items-center gap-2">
            <input
              type="radio"
              [name]="'quiz-correct-' + qi"
              class="h-4 w-4 accent-brand"
              [title]="'content.quiz.correct_answer' | translate"
              [checked]="answer.is_correct"
              (change)="setCorrectAnswer(qi, ai)"
            />
            <input
              type="text"
              class="flex-1 rounded-md border border-slate-300 px-2.5 py-1.5 text-sm focus:border-brand-accent focus:outline-none focus:ring-1 focus:ring-brand-accent dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100"
              [placeholder]="'content.quiz.answer_placeholder' | translate"
              [value]="answer.answer_text"
              (input)="updateAnswerText(qi, ai, $any($event.target).value)"
            />
            <button
              type="button"
              class="text-slate-600 dark:text-slate-400 hover:text-brand-accent"
              [attr.aria-label]="'content.quiz.remove_answer' | translate"
              (click)="removeAnswer(qi, ai)"
            >
              <i class="fa-solid fa-xmark text-xs"></i>
            </button>
          </div>
        }
      </div>

      <button
        type="button"
        class="mt-2 text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-brand-accent"
        (click)="addAnswer(qi)"
      >
        <i class="fa-solid fa-plus mr-1"></i>{{ 'content.quiz.add_answer' | translate }}
      </button>
    </div>
  }

  <button
    type="button"
    class="self-start rounded-md border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 shadow-e1 transition hover:border-brand-accent hover:text-brand-accent dark:border-slate-600 dark:bg-slate-800 dark:text-slate-200"
    (click)="addQuestion()"
  >
    <i class="fa-solid fa-plus mr-1"></i>{{ 'content.quiz.add_question' | translate }}
  </button>
</div>
