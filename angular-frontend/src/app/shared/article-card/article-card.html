<div
  (click)="open()"
  (keydown.enter)="open()"
  (keydown.space)="open()"
  tabindex="0"
  role="button"
  class="group relative flex cursor-pointer flex-col justify-between overflow-hidden rounded-2xl border border-gray-150 bg-white p-5 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-[#E30613] min-h-[160px] dark:border-zinc-800 dark:bg-zinc-900"
  [class]="styles().borderHover + ' ' + styles().borderAccent"
>
  <div class="mb-3 flex w-full shrink-0 items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="flex h-7 w-7 items-center justify-center rounded-lg text-sm transition-transform group-hover:scale-105" [class]="styles().iconBg">
        <i class="fa-solid" [class]="icon()"></i>
      </div>
      <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400 dark:text-zinc-500">{{ article().categoryName }}</span>
    </div>
    @if (isNew()) {
      <span class="inline-flex items-center gap-1 rounded-full border border-red-100/50 bg-red-50 px-1.5 py-0.5 text-[9px] font-semibold text-[#E30613] dark:border-red-900/30 dark:bg-red-950/40 dark:text-red-400">
        <span class="h-1 w-1 rounded-full bg-[#E30613] dark:bg-red-500"></span>{{ 'articles.card.new_badge' | translate }}
      </span>
    }
  </div>

  <h4
    class="mb-4 min-h-[2.6rem] w-full text-left text-[13.5px] font-semibold leading-tight text-gray-800 line-clamp-2 dark:text-zinc-200"
    [class]="styles().textAccent"
    [title]="article().title"
  >
    {{ article().title }}
  </h4>

  <div class="mt-auto flex w-full shrink-0 items-center justify-between border-t border-gray-50 pt-3 text-[10.5px] text-gray-400 dark:border-zinc-800/50 dark:text-zinc-500">
    <span class="flex items-center gap-1.5"><i class="fa-regular fa-calendar text-xs"></i>{{ dateLabel() }}</span>
    <span class="flex items-center gap-1.5"><i class="fa-regular fa-clock text-xs"></i>{{ 'articles.card.read_time' | translate: { minutes: article().readTime } }}</span>
  </div>
</div>
