<a
  [routerLink]="['/category', routeKey()]"
  class="group relative flex h-full w-full flex-col justify-between overflow-hidden rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-center shadow-e1 transition duration-slow ease-standard hover:-translate-y-0.5 hover:scale-[1.01] hover:shadow-e2 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-accent dark:border-slate-700 dark:bg-slate-900/60 md:px-3.5 md:py-2.5"
>
  <span class="absolute inset-x-0 top-0 h-[2px] origin-left scale-x-0 bg-brand transition-transform duration-slow ease-standard group-hover:scale-x-100"></span>
  @if (hasRecent()) {
    <span
      class="absolute right-4 top-4 h-2 w-2 rounded-full bg-brand"
      [title]="'articles.category_tile.recent_indicator' | translate"
    ></span>
  }
  <div class="mt-0.5 flex w-full flex-col items-center gap-1">
    <span class="cat-tile-icon mb-1 flex h-9 w-9 items-center justify-center rounded-lg bg-slate-50 text-lg text-slate-600 shadow-e1 transition-colors duration-slow group-hover:text-brand-accent dark:bg-slate-800 dark:text-slate-400 md:h-11 md:w-11 md:text-xl">
      <i class="fa-solid" [class]="icon()" aria-hidden="true"></i>
    </span>
    <span class="text-xs font-bold leading-snug text-slate-800 transition-colors group-hover:text-slate-950 dark:text-slate-200 dark:group-hover:text-white md:text-sm">{{ category().name }}</span>
  </div>
  <div class="mt-1.5 flex w-full items-center justify-center">
    <span class="inline-flex items-center rounded-full bg-slate-100/80 px-2 py-0.5 text-xs font-semibold text-slate-600 transition-colors group-hover:bg-slate-200/80 dark:bg-slate-800/80 dark:text-slate-400 dark:group-hover:bg-slate-700/80 md:text-xs">
      {{ 'articles.category_tile.article_count' | translate: { count: articleCount() } }}
    </span>
  </div>
</a>
