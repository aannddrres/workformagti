<div class="mx-auto w-full max-w-[920px] px-4 pb-8 pt-4 md:px-6 md:pt-6">
  <div class="mb-6">
    <button
      (click)="goBack()"
      class="mb-4 inline-flex items-center gap-2 rounded-xl border border-gray-200 bg-white px-4 py-2 text-sm font-medium text-gray-600 shadow-sm transition-all hover:bg-gray-50 hover:text-gray-900 active:scale-[0.98] dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-300"
    >
      <i aria-hidden="true" class="fa-solid fa-arrow-left text-xs"></i> {{ 'articles.detail_page.back_button' | translate }}
    </button>
  </div>

  @if (loading()) {
    <div class="animate-pulse space-y-4 rounded-2xl border border-gray-100 bg-white p-6 shadow-sm dark:border-zinc-800 dark:bg-zinc-900 sm:p-8">
      <div class="h-3 w-1/3 rounded bg-gray-100 dark:bg-zinc-800"></div>
      <div class="h-8 w-2/3 rounded bg-gray-100 dark:bg-zinc-800"></div>
      <div class="h-4 w-full rounded bg-gray-100 dark:bg-zinc-800"></div>
      <div class="h-4 w-full rounded bg-gray-100 dark:bg-zinc-800"></div>
    </div>
  } @else if (notFound()) {
    <p class="rounded-xl border border-dashed border-slate-200 bg-white/40 p-8 text-center text-sm font-medium text-slate-400 dark:border-zinc-700 dark:bg-zinc-800/40">
      {{ 'news.detail_page.not_found' | translate }}
    </p>
  } @else if (item(); as n) {
    <article class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm dark:border-zinc-800 dark:bg-zinc-900 sm:p-8">
      <div class="mb-4 flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-zinc-400">
        <span class="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium normal-case tracking-normal" [class]="badge()!.colorClass">{{ badge()!.label }}</span>
        <span>{{ dateLabel() }}</span>
      </div>
      <h1 class="mb-6 text-3xl font-extrabold leading-tight text-gray-900 dark:text-zinc-100">{{ n.title }}</h1>
      <hr class="mb-6 border-gray-100 dark:border-zinc-800" />
      <div
        class="article-content-optimized prose max-w-none text-sm leading-relaxed text-gray-700 dark:text-zinc-300 sm:text-base"
        [innerHTML]="formattedContent()"
      ></div>
      @if (n.attachment_url) {
        <div class="mt-8 border-t border-gray-150 pt-6 dark:border-zinc-800">
          <a
            [href]="n.attachment_url"
            target="_blank"
            rel="noopener"
            class="inline-flex items-center gap-2 rounded-xl border border-gray-200 bg-gray-50 px-4 py-2.5 text-sm font-medium text-[#B91C1C] transition-colors hover:bg-red-50 dark:border-zinc-700 dark:bg-zinc-800"
          >
            <i class="fa-solid fa-paperclip"></i>
            <span>{{ 'news.detail_page.attachment_download' | translate }}</span>
          </a>
        </div>
      }
    </article>
  }
</div>
