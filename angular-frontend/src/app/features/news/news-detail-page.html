<div class="mx-auto w-full max-w-[920px] px-4 pb-8 pt-4 md:px-6 md:pt-6">
  <div class="mb-6">
    <button
      (click)="goBack()"
      class="mb-4 inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-normal text-slate-600 shadow-e1 transition hover:bg-slate-50 hover:text-slate-900 active:scale-[0.98] dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300"
    >
      <i aria-hidden="true" class="fa-solid fa-arrow-left text-xs"></i> {{ 'articles.detail_page.back_button' | translate }}
    </button>
  </div>

  @if (loading()) {
    <div class="animate-pulse space-y-4 rounded-lg border border-slate-100 bg-white p-6 shadow-e1 dark:border-slate-800 dark:bg-slate-900 sm:p-8">
      <div class="h-3 w-1/3 rounded-sm bg-slate-100 dark:bg-slate-800"></div>
      <div class="h-8 w-2/3 rounded-sm bg-slate-100 dark:bg-slate-800"></div>
      <div class="h-4 w-full rounded-sm bg-slate-100 dark:bg-slate-800"></div>
      <div class="h-4 w-full rounded-sm bg-slate-100 dark:bg-slate-800"></div>
    </div>
  } @else if (notFound()) {
    <p class="rounded-lg border border-dashed border-slate-200 bg-white/40 p-8 text-center text-sm font-normal text-slate-600 dark:text-slate-400 dark:border-slate-700 dark:bg-slate-800/40">
      {{ 'news.detail_page.not_found' | translate }}
    </p>
  } @else if (item(); as n) {
    <article class="rounded-lg border border-slate-100 bg-white p-6 shadow-e1 dark:border-slate-800 dark:bg-slate-900 sm:p-8">
      <div class="mb-4 flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400">
        <span class="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-normal normal-case tracking-normal" [class]="badge()!.colorClass">{{ badge()!.label }}</span>
        <span>{{ dateLabel() }}</span>
      </div>
      <h1 class="mb-6 text-2xl font-bold leading-snug text-slate-900 dark:text-slate-100">{{ n.title }}</h1>
      <hr class="mb-6 border-slate-100 dark:border-slate-800" />
      <div
        class="article-content-optimized prose max-w-none text-sm leading-relaxed text-slate-700 dark:text-slate-300 sm:text-base"
        [innerHTML]="formattedContent()"
      ></div>
      @if (n.attachment_url) {
        <div class="mt-8 border-t border-slate-200 pt-6 dark:border-slate-800">
          <a
            [href]="n.attachment_url"
            target="_blank"
            rel="noopener"
            class="inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm font-normal text-brand-accent transition-colors hover:bg-red-50 dark:border-slate-700 dark:bg-slate-800"
          >
            <i class="fa-solid fa-paperclip"></i>
            <span>{{ 'news.detail_page.attachment_download' | translate }}</span>
          </a>
        </div>
      }
    </article>

    <!-- Compliance confirmation lives at the end of the material, not on a list row. -->
    <app-reading-confirm itemType="news" [itemId]="n.id" />
  }
</div>
