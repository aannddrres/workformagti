<div class="mx-auto w-full max-w-[920px] px-4 pb-8 pt-4 md:px-6 md:pt-6">
  <div class="mb-6">
    <button
      (click)="goBack()"
      class="mb-4 inline-flex items-center gap-2 rounded-xl border border-gray-200 bg-white px-4 py-2 text-sm font-medium text-gray-600 shadow-sm transition-all hover:bg-gray-50 hover:text-gray-900 active:scale-[0.98] dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-300"
    >
      <i aria-hidden="true" class="fa-solid fa-arrow-left text-xs"></i> {{ 'articles.detail_page.back_button' | translate }}
    </button>
  </div>

  @if (loading()) {
    <div class="aspect-video w-full animate-pulse rounded-2xl bg-gray-100 dark:bg-zinc-800"></div>
  } @else if (notFound()) {
    <p class="rounded-xl border border-dashed border-slate-200 bg-white/40 p-8 text-center text-sm font-medium text-slate-400 dark:border-zinc-700 dark:bg-zinc-800/40">
      {{ 'videos.detail_page.not_found' | translate }}
    </p>
  } @else if (video(); as v) {
    <div class="overflow-hidden rounded-2xl border border-gray-100 bg-black shadow-sm dark:border-zinc-800">
      @if (embedUrl(); as url) {
        <iframe
          class="aspect-video w-full"
          [src]="url"
          title="video"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      } @else {
        <video class="aspect-video w-full" [src]="v.video_url" controls></video>
      }
    </div>
    <div class="mt-4 flex items-center justify-between rounded-2xl border border-gray-100 bg-white p-4 shadow-sm dark:border-zinc-800 dark:bg-zinc-900">
      <h1 class="text-xl font-bold text-gray-900 dark:text-zinc-100">{{ v.title }}</h1>
      <span class="shrink-0 text-sm text-gray-400 dark:text-zinc-500">
        <i class="fa-solid fa-eye mr-1"></i>{{ 'videos.page.views_label' | translate: { count: v.views_count } }}
      </span>
    </div>

    <!-- Compliance confirmation lives with the material, not on a list row. -->
    <app-reading-confirm itemType="video" [itemId]="v.id" />
  }
</div>
