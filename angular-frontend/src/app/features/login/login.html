<div class="flex min-h-screen items-center justify-center bg-gray-50 px-4 dark:bg-gray-900">
  <div class="w-full max-w-sm rounded-2xl border border-gray-100 bg-white p-8 shadow-sm dark:border-gray-800 dark:bg-gray-800">
    <h1 class="mb-1 text-2xl font-semibold text-gray-800 dark:text-gray-100">{{ 'auth.login_page.heading' | translate }}</h1>
    <p class="mb-6 text-sm text-gray-500 dark:text-gray-400">{{ 'auth.login_page.subtitle' | translate }}</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <div>
        <label for="login-email" class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">
          {{ 'auth.login_page.email_label' | translate }}
        </label>
        <input
          id="login-email"
          type="email"
          formControlName="email"
          autocomplete="username"
          class="w-full rounded-lg border border-gray-200 px-3 py-2.5 text-sm text-gray-800 focus:border-[#B91C1C] focus:outline-none focus:ring-1 focus:ring-[#B91C1C] dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100"
        />
      </div>

      <div>
        <label for="login-password" class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">
          {{ 'auth.login_page.password_label' | translate }}
        </label>
        <input
          id="login-password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [placeholder]="'auth.login_page.password_placeholder' | translate"
          class="w-full rounded-lg border border-gray-200 px-3 py-2.5 text-sm text-gray-800 focus:border-[#B91C1C] focus:outline-none focus:ring-1 focus:ring-[#B91C1C] dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100"
        />
      </div>

      @if (errorMessage()) {
        <p class="text-sm text-red-600 dark:text-red-400">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        [disabled]="submitting()"
        class="mt-2 rounded-lg bg-[#B91C1C] px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-[#9B1717] disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ (submitting() ? 'auth.login_page.submit_button_loading' : 'auth.login_page.submit_button') | translate }}
      </button>
    </form>
  </div>
</div>
