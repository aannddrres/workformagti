# TEMPLATE ONLY -- DO NOT FILL THIS IN AND DO NOT COMMIT IT FILLED IN.
#
# This file exists to document the two values the backend needs and what
# they have to look like. It is deliberately not part of kustomization.yaml,
# so `kubectl apply -k .` will not create it.
#
# Create the real Secret out of band, so the values never enter git:
#
#   kubectl -n <namespace> create secret generic portal-backend-secrets \
#     --from-literal=SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(64))')" \
#     --from-literal=ORACLE_DB_PASSWORD='<the database password>'
#
# Or, if the cluster has a sealed-secrets / external-secrets operator, use
# that instead -- it is the better answer and this file is not in the way of it.
#
# ---------------------------------------------------------------------
#
# SECRET_KEY signs every session token. ProductionSafetyGuard refuses to
# boot on a value that is blank, shorter than 48 characters, contains a
# placeholder marker (change-me, secret, temporary, ...) or has fewer than
# 12 distinct characters. That guard is not decoration: the whole portal's
# authentication is one signature, and a guessable key forges any employee's
# session, including a system administrator's.
#
# Changing it later logs everybody out. That is fine, and is the correct
# response if it is ever suspected of having leaked.
#
# ORACLE_DB_PASSWORD is the application schema's password. The guard also
# rejects the development passwords shipped in this repository, so a
# copy-paste from a compose file fails the rollout rather than reaching
# production.
apiVersion: v1
kind: Secret
metadata:
  name: portal-backend-secrets
  namespace: "<<< IT-01 >>>"
  labels:
    app.kubernetes.io/name: portal-backend
    app.kubernetes.io/part-of: magti-portal
type: Opaque
stringData:
  SECRET_KEY: "<<< IT-07 >>>"
  ORACLE_DB_PASSWORD: "<<< IT-08 >>>"
