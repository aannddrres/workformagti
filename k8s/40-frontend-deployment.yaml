# The Angular bundle, served by nginx, which also proxies /api and /uploads
# to the backend Service.
#
# That proxying is why the Ingress only needs one rule: the browser sees a
# single origin, which is also what lets the session cookie be
# SameSite=strict.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-frontend
  namespace: "<<< IT-01 >>>"
  labels:
    app.kubernetes.io/name: portal-frontend
    app.kubernetes.io/part-of: magti-portal
spec:
  # See IT-09.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-frontend
        app.kubernetes.io/part-of: magti-portal
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: portal-frontend
      securityContext:
        # uid 101 is the `nginx` user in the nginx:1.27-alpine base image;
        # angular-frontend/Dockerfile drops to it and chowns the three paths
        # nginx writes to at runtime. Verified on a running container
        # (2026-08-29): `id` reports uid=101(nginx).
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "<<< IT-03 >>>"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Must match the backend Service name and port (31-backend-service.yaml).
            - name: BACKEND_HOST
              value: "portal-backend"
            - name: BACKEND_PORT
              value: "8080"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx writes to exactly three places at runtime, and all three
            # need to be writable under a read-only root:
            #   /var/cache/nginx   proxy and temp buffers
            #   /run               the pid file (/var/run is a symlink to it)
            #   /etc/nginx/conf.d  where the official entrypoint renders
            #                      nginx.conf.template through envsubst,
            #                      substituting BACKEND_HOST/BACKEND_PORT
            # The third is the one that is easy to miss: without it the
            # container starts, fails to write the rendered config, and exits
            # before serving anything.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # See IT-10. nginx serving static files is cheap; this is mostly headroom
            # for connection buffers.
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
      terminationGracePeriodSeconds: 30
