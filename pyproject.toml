[tool.pytest.ini_options]
# The repository root, so tests/ can import scripts.* however pytest is
# started. CI runs plain `pytest tests/`, which puts only tests/ on the path;
# scripts/verify-like-ci.sh runs `python -m pytest`, which also adds the
# current directory. The Phase 8 tests import scripts.seed_phase8_org_fixtures,
# so the wrapper passed while CI's seeder job failed at collection.
pythonpath = ["."]

[tool.ruff]
line-length = 120
exclude = ["venv", ".venv", "migrations"]

[tool.ruff.lint]
# Conservative on purpose: catch real defects (unused imports, undefined
# names, obvious bugs), not full pycodestyle style — this codebase has no
# prior formatting pass, and enforcing that now would force a mass reformat
# CLAUDE.md's "surgical edits only" rule discourages. Widen this ruleset
# deliberately later, not as a side effect of adding CI.
select = ["E9", "F"]
