name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# One run per branch. Pushing three commits in a row used to start three full
# runs and let all three finish, when only the last one's result could matter.
# main is exempt: cancelling there would leave the trunk unverified, which is
# the one place that must never happen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The two jobs below that need an Oracle are most of what a full run costs,
# and every push to every branch was paying it. That is what exhausted the
# account's Actions allowance on 2026-08-22, with a week of the billing
# period left and every branch's CI dead from then on.
#
# They are now restricted to the two moments the answer is load-bearing: a
# pull request (the review gate) and main (the trunk). A plain branch push
# still runs the fast jobs -- the Python suite and its lint, the DB-free Java
# suite, and the Angular build with its i18n and typecheck guards -- so a
# typo is still caught in a couple of minutes.
#
# The trade-off is stated rather than hidden: between pushing to a branch and
# opening a pull request, nothing verifies the Oracle-backed behaviour except
# running it locally. scripts/verify-like-ci.sh runs exactly what these jobs
# run, so that is a repeatable claim rather than a promise.
#
# Brought across from claude/r5-complete-r6-planning, which is where the
# allowance ran out and where this was worked out.
jobs:
  secret-scan:
    name: Credential hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"
      - name: Verify scanner detection and redaction
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/test_secret_scan.py -q
      - name: Scan permitted tracked files and incoming commits
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$EVENT_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git merge-base HEAD origin/main)"
          fi
          bash scripts/scan-secrets.sh --base "$base"

  # What is left of Python after the legacy FastAPI stack was deleted
  # (2026-08-31): the seeders that fill the demo and UAT environments, and
  # the Phase 8 Oracle fixture seeder. This job used to run the whole legacy
  # application's suite -- 31 test files against an app that no longer
  # exists -- and was for a long time the ONLY thing CI ran, which is how
  # the Java and Angular halves went untested on every push (audit PR-01).
  #
  # Kept rather than deleted because these tools are still load-bearing:
  # nothing else fills a demo database, and a seeder that silently stops
  # working is discovered in front of an audience.
  seeder-tools:
    name: Seeder tooling (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check scripts/ tests/

      # The Oracle-backed fixture tests skip themselves unless
      # RUN_ORACLE_FIXTURE_TESTS=true, so this runs green without a database.
      - name: Run tests
        run: python -m pytest tests/ -q

  # The Java backend is what actually goes to production, but nothing here
  # compiled or tested it until now (audit finding PR-01) -- every PR went
  # green on the legacy Python suite alone.
  #
  # It is split in two because ~220 of the tests need a live Oracle: this job
  # is fast, needs no services, and gates every push; java-integration below
  # brings up a database for the rest. The split is by JUnit tag, and
  # OracleTagCoverageTest fails the build if a @SpringBootTest is missing
  # @RequiresOracle, so a new integration test cannot silently land in this
  # job and start failing with ORA-12541.
  java-unit:
    name: Java unit tests (no database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run DB-free tests
        run: mvn -B test -DexcludedGroups=oracle

  # The Angular app is the other half of what actually ships, and CI never
  # compiled it either (audit PR-01). It could not simply be added: `ng build`
  # and `ng test` refuse to run below Node v22.22.3, and the dev container is
  # pinned one patch under that (PR-10) — so these commands cannot be verified
  # locally at all, and this job is the only place they run. That is the
  # argument for the job, not against it.
  #
  # Node comes from angular-frontend/.nvmrc so the workflow, package.json's
  # engines floor and the Dockerfile builder stage cannot drift apart.
  #
  # ng test is vitest-backed here (@angular/build:unit-test), not Karma, so no
  # browser or display server is needed.
  frontend:
    name: Angular build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: angular-frontend/.nvmrc
          cache: npm
          cache-dependency-path: angular-frontend/package-lock.json

      - name: Install
        run: npm ci

      # Release audit requires every actionable advisory to be resolved,
      # including moderate findings in shipped and build-time dependencies.
      - name: Vulnerable shipped dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Advisories in build tooling
        run: npm audit --audit-level=moderate

      # Before the build, because it needs no build and a missing key is
      # cheaper to report on its own than buried under bundle output.
      - name: Translations complete
        run: npm run check:i18n

      # Added 2026-09-05. This half of the codebase had no linter at all --
      # no config, no script, no step -- while the Java half was held to
      # eight coverage tests. The rule set is the recommended baseline and
      # nothing more, so it gates from its first commit rather than being
      # switched off on its second. Prettier is configured and has a
      # `format:check` script, but is deliberately NOT gated here: nearly every
      # file predates any formatting pass (184 of 220 on 2026-09-21), and
      # reformatting them belongs in its own commit rather than in whichever
      # one happened to add the step.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npx ng build --configuration production

      # The nginx that serves this bundle sends
      # "script-src 'self'" with no 'unsafe-inline'
      # (angular-frontend/nginx.conf.template). That directive is only safe
      # while the build emits no inline script, and what decides that is
      # optimization.styles.inlineCritical in angular.json: turn it back on
      # and Angular inlines the critical CSS, then swaps the real stylesheet
      # in with onload="this.media='all'" -- an inline handler the CSP
      # refuses to run, leaving the portal rendered with no styles at all.
      #
      # That failure is silent: the build passes, the unit tests pass, the
      # page returns 200, and only a browser with the real headers shows it.
      # So it is checked here, against the actual artefact, rather than left
      # to be found in a demo.
      - name: Bundle stays CSP-compatible
        run: |
          index=dist/angular-frontend/browser/index.html
          test -f "$index" || { echo "no built index.html at $index"; exit 1; }
          if grep -qiE '<[^>]+ on[a-z]+=' "$index"; then
            echo "index.html carries an inline event handler:"
            grep -oiE '<[^>]+ on[a-z]+="[^"]*"' "$index"
            echo
            echo "script-src 'self' will refuse to run it. Check that"
            echo "optimization.styles.inlineCritical is still false in angular.json,"
            echo "or widen the CSP in nginx.conf.template on purpose."
            exit 1
          fi
          # A <script src=...></script> has nothing between the tags, so only
          # a block with actual content matches. Written without a lookahead
          # on purpose: grep -E has none, and the version that used one never
          # matched anything, which is worse than not checking at all.
          if grep -qE '<script[^>]*>[[:space:]]*[^[:space:]<]' "$index"; then
            echo "index.html carries an inline <script> block; script-src 'self' blocks it."
            exit 1
          fi
          echo "no inline handlers or inline scripts -- CSP contract holds."

      - name: Unit tests
        run: npx ng test --watch=false

  # Gating. Proven green on commit 905e8db: 221 tests, 0 failures, 0 errors,
  # in a 2m52s job (Flyway applies every migration into a fresh XE 21c, so
  # this also exercises the migrations themselves on every push). Was
  # advisory only until a run had actually passed; it has, so the training
  # wheels are off. timeout-minutes stays as a backstop against a container
  # that never reports healthy holding a runner to the 6-hour job limit.
  java-integration:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: Java integration tests (Oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: java-backend
    services:
      oracle:
        # Oracle XE 21c, NOT Free 23ai. There is no publicly pullable 19c
        # image, so the version has to be chosen deliberately -- and 23ai is
        # the wrong choice here, proved by running it: every test errored with
        #   Schema validation: wrong column type encountered in column
        #   [is_draft] in table [articles]; found [number (Types#NUMERIC)],
        #   but expecting [boolean (Types#BOOLEAN)]
        # Oracle 23ai added a native BOOLEAN type, so Hibernate picks a
        # dialect that maps Java boolean -> BOOLEAN, while all 15 of this
        # schema's flag columns are NUMBER(1) (V4:24, V5:13, ...) as 19c
        # requires. With ddl-auto=validate that is a hard startup failure.
        # 21c has no native BOOLEAN, so it agrees with 19c on exactly the
        # thing production depends on.
        image: gvenzl/oracle-xe:21-slim-faststart
        env:
          # Throwaway credentials for an ephemeral container that exists for
          # the length of one job and holds only test data. Not a secret, and
          # deliberately not matching any real environment's values.
          ORACLE_PASSWORD: ci_only_sys_pw
          APP_USER: magti_app
          APP_USER_PASSWORD: ci_only_app_pw
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Oracle-backed tests
        run: mvn -B -e test -Dgroups=oracle
        env:
          ORACLE_DB_URL: jdbc:oracle:thin:@localhost:1521/XEPDB1
          ORACLE_DB_USER: magti_app
          ORACLE_DB_PASSWORD: ci_only_app_pw

      # Surefire truncates the console summary at ~1.5k chars, which cuts the
      # message off before the "Caused by" -- so a failing run says only
      # "Failed to load ApplicationContext" with no reason anywhere in the log.
      # The real stack traces are in target/surefire-reports/*.txt, which
      # nothing was collecting. Echo the root causes into the log (fastest to
      # read) and upload the full set (for anything the grep misses).
      - name: Surefire root causes
        if: always()
        run: |
          shopt -s nullglob
          reports=(target/surefire-reports/*.txt)
          if [ ${#reports[@]} -eq 0 ]; then echo "no surefire reports"; exit 0; fi
          echo "===== distinct root causes ====="
          grep -h -E "^Caused by|^[A-Za-z.]+(Exception|Error):" "${reports[@]}" \
            | sort -u | head -40
          echo "===== head of first report ====="
          head -60 "${reports[0]}"

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-oracle
          path: java-backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

  e2e:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: End-to-end (Angular + Spring Boot + Oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # The one job that runs the whole product: a browser drives the real
    # Angular build, against the real Spring Boot app, against a real Oracle.
    # Everything else here tests one layer in isolation -- which is why the
    # audits kept finding defects that every suite was green through.
    #
    # Oracle is started by a STEP here, not by `services:` as java-integration
    # does it, and the reason is diagnosability rather than taste. For a job
    # with a service container the runner appends that container's entire log
    # -- ~110 lines of Oracle startup banner -- after every step has finished.
    # The Actions API returns only a capped window from the end of a job log,
    # so that banner is the last thing in the window and the E2E failure
    # summary never is. Four rounds of debugging were spent reading Oracle
    # boot messages instead of the failing assertion. Nothing inside the job
    # can move output after the runner's own post-job dump; not having a
    # service container is the only thing that removes it.
    steps:
      - uses: actions/checkout@v4

      # Same image and same reasoning as java-integration: XE 21c has no
      # native BOOLEAN, so it agrees with production 19c about the NUMBER(1)
      # flag columns that ddl-auto=validate checks at startup.
      - name: Start Oracle
        run: |
          docker run -d --name e2e-oracle -p 1521:1521 \
            -e ORACLE_PASSWORD=ci_only_sys_pw \
            -e APP_USER=magti_app \
            -e APP_USER_PASSWORD=ci_only_app_pw \
            gvenzl/oracle-xe:21-slim-faststart
          # Same budget the service-container healthcheck had: a 60s grace
          # period plus 30 tries at 10s.
          for i in $(seq 1 36); do
            if docker exec e2e-oracle healthcheck.sh > /dev/null 2>&1; then
              echo "Oracle healthy after $((i * 10))s"; exit 0
            fi
            sleep 10
          done
          echo "Oracle never became healthy"; docker logs --tail 40 e2e-oracle; exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version-file: angular-frontend/.nvmrc
          cache: npm
          cache-dependency-path: angular-frontend/package-lock.json

      - name: Build backend
        working-directory: java-backend
        run: mvn -B -DskipTests package

      - name: Start backend
        working-directory: java-backend
        env:
          ORACLE_DB_URL: jdbc:oracle:thin:@localhost:1521/XEPDB1
          ORACLE_DB_USER: magti_app
          ORACLE_DB_PASSWORD: ci_only_app_pw
          # The E2E personas (admin@magti.ge, content@magti.ge, info@magti.ge,
          # test_operator_*) are JIT-provisioned by AuthenticationService.
          #
          # That needs BOTH of these, not just APP_ENV. The first run of this
          # job set only APP_ENV and five of six specs failed to log in --
          # ProductionSafetyGuard logged "dev-login=disabled" and meant it.
          # The second flag is the SEC-01 fix working exactly as designed: the
          # password-less login used to ride along on one variable defaulting
          # to "development", which is how it shipped enabled. It now has to
          # be asked for twice, deliberately, and this job is the one place
          # that asks -- an ephemeral container, throwaway data, no network
          # exposure, torn down with the run.
          APP_ENV: development
          ALLOW_DEV_LOGIN: "true"
          COOKIE_SECURE: "false"
          ROLLOUT_FILE_ENTITLEMENT: "true"
        run: |
          nohup java -jar target/*.jar > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "backend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"; tail -80 "$GITHUB_WORKSPACE/backend.log"; exit 1

      # Fail here, on the thing that is actually wrong, rather than three
      # steps later as five specs that cannot log in. The first run of this
      # job spent its whole diagnosis budget on exactly that confusion.
      - name: Verify a JIT persona can log in
        run: |
          code=$(curl -s -o /tmp/login.json -w '%{http_code}' \
            -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@magti.ge","password":"anything"}')
          if [ "$code" != "200" ]; then
            echo "JIT login returned $code, expected 200:"; cat /tmp/login.json; echo
            echo "The E2E personas need APP_ENV=development AND ALLOW_DEV_LOGIN=true."
            grep -o 'Startup security config:.*' "$GITHUB_WORKSPACE/backend.log" || true
            exit 1
          fi
          echo "JIT login OK"

      - name: Install frontend dependencies
        working-directory: angular-frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: angular-frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: angular-frontend
        run: |
          nohup npx ng serve --port 4200 > "$GITHUB_WORKSPACE/frontend.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:4200 > /dev/null; then
              echo "frontend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "frontend did not become reachable"; tail -60 "$GITHUB_WORKSPACE/frontend.log"; exit 1

      - name: Run E2E specs
        working-directory: angular-frontend
        env:
          # proxy.conf.json already forwards /api and /uploads to :8080, so the
          # browser talks to the same origin a user would.
          E2E_BASE_URL: http://localhost:4200
        run: npx playwright test

      - name: Build shipping frontend for nginx checks
        run: docker build --build-arg BUILD_CONFIGURATION=production -t magti-nginx-smoke:${{ github.sha }} angular-frontend

      - name: Upload boundaries and timeout through shipping nginx
        env:
          NGINX_SMOKE_CONFIRM: isolated-synthetic-data
          NGINX_SMOKE_IMAGE: magti-nginx-smoke:${{ github.sha }}
          NGINX_SMOKE_BACKEND_PORT: "8080"
          NGINX_SMOKE_RUN_FULL: "true"
        run: bash scripts/verify-nginx-smoke.sh

      # Only the lines that would explain a server that FELL OVER. The full
      # dumps used to live here and were never once the answer -- every real
      # diagnosis in this suite has come from Playwright's own block -- while
      # the 60 lines they printed pushed that block out of the range the
      # Actions API returns from the tail. Errors only, and few of them.
      - name: Server errors on failure
        if: failure()
        run: |
          echo "===== backend errors ====="
          grep -E "ERROR|Exception|Caused by" backend.log | tail -8 || echo "(none)"
          echo "===== frontend errors ====="
          grep -iE "error|failed" frontend.log | tail -5 || echo "(none)"

      # Which specs failed, and why.
      #
      # Emitted THREE ways, because each of the first two turned out to be
      # unreachable from outside the browser UI:
      #
      #   ::error:: annotations   the one that actually works remotely. They
      #                           come back from the check-run API in a single
      #                           small response, with no log to page through.
      #   $GITHUB_STEP_SUMMARY    rendered on the run's own page, for a human.
      #   stdout                  last in the job, on purpose.
      #
      # The log route alone is not enough and that cost several rounds to
      # learn. Playwright prints this block ~230 lines from the end, under two
      # server-log dumps, and the runner then appends the whole Oracle service
      # container log after everything. The Actions API caps how much of a log
      # it returns from the tail, so on a real run the block cannot be reached:
      # repeated attempts came back with nothing but Flyway lines and Oracle
      # startup banners. Downloading the report artifact instead is not a way
      # out either -- it is served from a storage host that a restricted
      # network can block, which is exactly what happened.
      # Which specs failed, and why.
      #
      # Order inside this step matters as much as the step being last. The
      # long forms go FIRST -- the ::error:: annotations, whose messages are
      # one very long %0A-escaped line each, and the run-page summary -- and
      # the short human list goes LAST, because the Actions API returns a
      # byte-capped window from the END of the log. Emitting the long forms
      # last is what made the previous version unreadable: the annotations
      # pushed the summary they were meant to duplicate out of the window.
      - name: Which specs failed
        if: failure()
        working-directory: angular-frontend
        run: |
          node -e '
            const fs = require("fs");
            const files = ["playwright-report/results.json", "playwright-report-shipping/results.json"];
            const failures = [];
            const walk = (suite, trail = []) => {
              const here = suite.title ? [...trail, suite.title] : trail;
              for (const spec of suite.specs ?? []) {
                if (spec.ok) continue;
                const name = [...here, spec.title].join(" > ");
                for (const test of spec.tests ?? []) {
                  for (const result of test.results ?? []) {
                    const message = (result.error?.message ?? "").split("\n");
                    const l = result.error?.location;
                    failures.push({ name, message, at: l ? l.file.replace(/^.*angular-frontend\//, "") + ":" + l.line : "" });
                  }
                }
              }
              for (const child of suite.suites ?? []) walk(child, here);
            };
            for (const f of files) {
              if (!fs.existsSync(f)) continue;
              const report = JSON.parse(fs.readFileSync(f, "utf8"));
              const target = f.includes("shipping") ? "shipping nginx" : "Angular dev server";
              for (const suite of report.suites ?? []) walk(suite, [target]);
            }

            // Long forms first. Newlines escaped as %0A or the runner keeps
            // only the first line, which is the assertion -- while the part
            // that names the element is the call log under it.
            for (const x of failures) {
              const detail = [x.name, ...x.message.slice(0, 16)].join("\n")
                .replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
              console.log("::error ::" + detail);
            }
            if (failures.length && process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                "## E2E failures\n\n" + failures.map((x) =>
                  "### " + x.name + "\n\n`" + x.at + "`\n\n```\n" + x.message.slice(0, 30).join("\n") + "\n```\n").join("\n"));
            }

            // Short form LAST, and kept short on purpose: this is the copy
            // that has to survive the tail window.
            console.log("");
            console.log("========== E2E FAILURES ==========");
            for (const x of failures) {
              console.log("FAILED  " + x.name);
              console.log("   at   " + x.at);
              for (const line of x.message.slice(0, 6)) console.log("   " + line);
            }
            console.log("==================================");
          ' || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            angular-frontend/playwright-report/
            angular-frontend/playwright-report-shipping/
            angular-frontend/test-results/
          retention-days: 7
          if-no-files-found: warn

  # Supply-chain: a Software Bill of Materials for each half of what ships, and
  # a point-in-time scan of both against known advisories. Dependabot already
  # opens PRs for vulnerable dependencies over time and the frontend job gates
  # `npm audit` -- but nothing produced an SBOM (the artifact procurement and
  # security reviews now ask for by name: EU CRA, US EO 14028), and nothing
  # gave the BACKEND a point-in-time "is anything vulnerable right now" check.
  # This job is both. The SBOMs are uploaded even when the scan fails, so a
  # reviewer can always fetch the exact dependency inventory.
  supply-chain:
    name: SBOM and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version-file: angular-frontend/.nvmrc
          cache: npm
          cache-dependency-path: angular-frontend/package-lock.json

      # CycloneDX SBOM of the backend's runtime + compile dependencies (not
      # test/build tooling). The plugin is bound to `package`, but the goal is
      # invoked directly here so no jar has to be built just to list deps.
      - name: Backend SBOM (CycloneDX)
        working-directory: java-backend
        run: mvn -B cyclonedx:makeAggregateBom

      - name: Frontend SBOM (CycloneDX)
        working-directory: angular-frontend
        run: |
          npm ci
          npm run sbom

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0

      # Scan each SBOM for advisories. --ignore-unfixed keeps the gate on
      # things a version bump can actually fix, so the build breaks on an
      # actionable advisory, not on an upstream one with no release yet.
      # Same severity floor the frontend `npm audit` gate already uses.
      - name: Scan backend SBOM
        run: trivy sbom java-backend/target/bom.json
             --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL

      - name: Scan frontend SBOM
        run: trivy sbom angular-frontend/bom.json
             --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL

      # Scan the shipped runtime layers as well as the dependency SBOMs.
      # --pkg-types os avoids scanning the same Java libraries twice; the
      # backend SBOM step above owns that part of the gate.
      - name: Build runtime images for scanning
        run: |
          docker build --pull -t magti-backend:scan java-backend
          docker build --pull -t magti-frontend:scan angular-frontend
          docker image inspect --format 'backend {{.Id}}' magti-backend:scan > image-digests.txt
          docker image inspect --format 'frontend {{.Id}}' magti-frontend:scan >> image-digests.txt

      - name: Scan backend runtime image
        run: trivy image magti-backend:scan --pkg-types os --exit-code 1
             --ignore-unfixed --severity HIGH,CRITICAL --format json
             --output backend-image-trivy.json

      - name: Scan frontend runtime image
        if: always()
        run: trivy image magti-frontend:scan --pkg-types os --exit-code 1
             --ignore-unfixed --severity HIGH,CRITICAL --format json
             --output frontend-image-trivy.json

      # Always upload, even if a scan above failed: the inventory is the point.
      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            java-backend/target/bom.json
            angular-frontend/bom.json
            backend-image-trivy.json
            frontend-image-trivy.json
            image-digests.txt
          retention-days: 90
          if-no-files-found: error
