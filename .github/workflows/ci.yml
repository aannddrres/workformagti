name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -q

  # The Java backend is what actually goes to production, but nothing here
  # compiled or tested it until now (audit finding PR-01) -- every PR went
  # green on the legacy Python suite alone.
  #
  # It is split in two because ~220 of the tests need a live Oracle: this job
  # is fast, needs no services, and gates every push; java-integration below
  # brings up a database for the rest. The split is by JUnit tag, and
  # OracleTagCoverageTest fails the build if a @SpringBootTest is missing
  # @RequiresOracle, so a new integration test cannot silently land in this
  # job and start failing with ORA-12541.
  java-unit:
    name: Java unit tests (no database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run DB-free tests
        run: mvn -B test -DexcludedGroups=oracle

  # The Angular app is the other half of what actually ships, and CI never
  # compiled it either (audit PR-01). It could not simply be added: `ng build`
  # and `ng test` refuse to run below Node v22.22.3, and the dev container is
  # pinned one patch under that (PR-10) — so these commands cannot be verified
  # locally at all, and this job is the only place they run. That is the
  # argument for the job, not against it.
  #
  # Node comes from angular-frontend/.nvmrc so the workflow, package.json's
  # engines floor and the Dockerfile builder stage cannot drift apart.
  #
  # ng test is vitest-backed here (@angular/build:unit-test), not Karma, so no
  # browser or display server is needed.
  frontend:
    name: Angular build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: angular-frontend/.nvmrc
          cache: npm
          cache-dependency-path: angular-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npx ng build --configuration production

      - name: Unit tests
        run: npx ng test --watch=false

  # Gating. Proven green on commit 905e8db: 221 tests, 0 failures, 0 errors,
  # in a 2m52s job (Flyway applies all 30 migrations into a fresh XE 21c, so
  # this also exercises the migrations themselves on every push). Was
  # advisory only until a run had actually passed; it has, so the training
  # wheels are off. timeout-minutes stays as a backstop against a container
  # that never reports healthy holding a runner to the 6-hour job limit.
  java-integration:
    name: Java integration tests (Oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: java-backend
    services:
      oracle:
        # Oracle XE 21c, NOT Free 23ai. There is no publicly pullable 19c
        # image, so the version has to be chosen deliberately -- and 23ai is
        # the wrong choice here, proved by running it: every test errored with
        #   Schema validation: wrong column type encountered in column
        #   [is_draft] in table [articles]; found [number (Types#NUMERIC)],
        #   but expecting [boolean (Types#BOOLEAN)]
        # Oracle 23ai added a native BOOLEAN type, so Hibernate picks a
        # dialect that maps Java boolean -> BOOLEAN, while all 15 of this
        # schema's flag columns are NUMBER(1) (V4:24, V5:13, ...) as 19c
        # requires. With ddl-auto=validate that is a hard startup failure.
        # 21c has no native BOOLEAN, so it agrees with 19c on exactly the
        # thing production depends on.
        image: gvenzl/oracle-xe:21-slim-faststart
        env:
          # Throwaway credentials for an ephemeral container that exists for
          # the length of one job and holds only test data. Not a secret, and
          # deliberately not matching any real environment's values.
          ORACLE_PASSWORD: ci_only_sys_pw
          APP_USER: magti_app
          APP_USER_PASSWORD: ci_only_app_pw
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Oracle-backed tests
        run: mvn -B -e test -Dgroups=oracle
        env:
          ORACLE_DB_URL: jdbc:oracle:thin:@localhost:1521/XEPDB1
          ORACLE_DB_USER: magti_app
          ORACLE_DB_PASSWORD: ci_only_app_pw

      # Surefire truncates the console summary at ~1.5k chars, which cuts the
      # message off before the "Caused by" -- so a failing run says only
      # "Failed to load ApplicationContext" with no reason anywhere in the log.
      # The real stack traces are in target/surefire-reports/*.txt, which
      # nothing was collecting. Echo the root causes into the log (fastest to
      # read) and upload the full set (for anything the grep misses).
      - name: Surefire root causes
        if: always()
        run: |
          shopt -s nullglob
          reports=(target/surefire-reports/*.txt)
          if [ ${#reports[@]} -eq 0 ]; then echo "no surefire reports"; exit 0; fi
          echo "===== distinct root causes ====="
          grep -h -E "^Caused by|^[A-Za-z.]+(Exception|Error):" "${reports[@]}" \
            | sort -u | head -40
          echo "===== head of first report ====="
          head -60 "${reports[0]}"

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-oracle
          path: java-backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

  e2e:
    name: End-to-end (Angular + Spring Boot + Oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # The one job that runs the whole product: a browser drives the real
    # Angular build, against the real Spring Boot app, against a real Oracle.
    # Everything else here tests one layer in isolation -- which is why the
    # audits kept finding defects that every suite was green through.
    services:
      oracle:
        # Same image and same reasoning as java-integration above: XE 21c has
        # no native BOOLEAN, so it agrees with production 19c about the
        # NUMBER(1) flag columns that ddl-auto=validate checks at startup.
        image: gvenzl/oracle-xe:21-slim-faststart
        env:
          ORACLE_PASSWORD: ci_only_sys_pw
          APP_USER: magti_app
          APP_USER_PASSWORD: ci_only_app_pw
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version-file: angular-frontend/.nvmrc
          cache: npm
          cache-dependency-path: angular-frontend/package-lock.json

      - name: Build backend
        working-directory: java-backend
        run: mvn -B -DskipTests package

      - name: Start backend
        working-directory: java-backend
        env:
          ORACLE_DB_URL: jdbc:oracle:thin:@localhost:1521/XEPDB1
          ORACLE_DB_USER: magti_app
          ORACLE_DB_PASSWORD: ci_only_app_pw
          # The E2E personas (admin@magti.ge, content@magti.ge, info@magti.ge,
          # test_operator_*) are JIT-provisioned by AuthenticationService.
          #
          # That needs BOTH of these, not just APP_ENV. The first run of this
          # job set only APP_ENV and five of six specs failed to log in --
          # ProductionSafetyGuard logged "dev-login=disabled" and meant it.
          # The second flag is the SEC-01 fix working exactly as designed: the
          # password-less login used to ride along on one variable defaulting
          # to "development", which is how it shipped enabled. It now has to
          # be asked for twice, deliberately, and this job is the one place
          # that asks -- an ephemeral container, throwaway data, no network
          # exposure, torn down with the run.
          APP_ENV: development
          ALLOW_DEV_LOGIN: "true"
          COOKIE_SECURE: "false"
        run: |
          nohup java -jar target/*.jar > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "backend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy"; tail -80 "$GITHUB_WORKSPACE/backend.log"; exit 1

      # Fail here, on the thing that is actually wrong, rather than three
      # steps later as five specs that cannot log in. The first run of this
      # job spent its whole diagnosis budget on exactly that confusion.
      - name: Verify a JIT persona can log in
        run: |
          code=$(curl -s -o /tmp/login.json -w '%{http_code}' \
            -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@magti.ge","password":"anything"}')
          if [ "$code" != "200" ]; then
            echo "JIT login returned $code, expected 200:"; cat /tmp/login.json; echo
            echo "The E2E personas need APP_ENV=development AND ALLOW_DEV_LOGIN=true."
            grep -o 'Startup security config:.*' "$GITHUB_WORKSPACE/backend.log" || true
            exit 1
          fi
          echo "JIT login OK"

      - name: Install frontend dependencies
        working-directory: angular-frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: angular-frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: angular-frontend
        run: |
          nohup npx ng serve --port 4200 > "$GITHUB_WORKSPACE/frontend.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:4200 > /dev/null; then
              echo "frontend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "frontend did not become reachable"; tail -60 "$GITHUB_WORKSPACE/frontend.log"; exit 1

      - name: Run E2E specs
        working-directory: angular-frontend
        env:
          # proxy.conf.json already forwards /api and /uploads to :8080, so the
          # browser talks to the same origin a user would.
          E2E_BASE_URL: http://localhost:4200
        run: npx playwright test

      - name: Server logs on failure
        if: failure()
        run: |
          echo "===== backend ====="; tail -120 backend.log || true
          echo "===== frontend ====="; tail -60 frontend.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            angular-frontend/playwright-report/
            angular-frontend/test-results/
          retention-days: 7
          if-no-files-found: warn
