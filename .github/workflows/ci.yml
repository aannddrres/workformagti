name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -q

  # The Java backend is what actually goes to production, but nothing here
  # compiled or tested it until now (audit finding PR-01) -- every PR went
  # green on the legacy Python suite alone.
  #
  # It is split in two because ~220 of the tests need a live Oracle: this job
  # is fast, needs no services, and gates every push; java-integration below
  # brings up a database for the rest. The split is by JUnit tag, and
  # OracleTagCoverageTest fails the build if a @SpringBootTest is missing
  # @RequiresOracle, so a new integration test cannot silently land in this
  # job and start failing with ORA-12541.
  java-unit:
    name: Java unit tests (no database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run DB-free tests
        run: mvn -B test -DexcludedGroups=oracle

  # Gating. Proven green on commit 905e8db: 221 tests, 0 failures, 0 errors,
  # in a 2m52s job (Flyway applies all 30 migrations into a fresh XE 21c, so
  # this also exercises the migrations themselves on every push). Was
  # advisory only until a run had actually passed; it has, so the training
  # wheels are off. timeout-minutes stays as a backstop against a container
  # that never reports healthy holding a runner to the 6-hour job limit.
  java-integration:
    name: Java integration tests (Oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: java-backend
    services:
      oracle:
        # Oracle XE 21c, NOT Free 23ai. There is no publicly pullable 19c
        # image, so the version has to be chosen deliberately -- and 23ai is
        # the wrong choice here, proved by running it: every test errored with
        #   Schema validation: wrong column type encountered in column
        #   [is_draft] in table [articles]; found [number (Types#NUMERIC)],
        #   but expecting [boolean (Types#BOOLEAN)]
        # Oracle 23ai added a native BOOLEAN type, so Hibernate picks a
        # dialect that maps Java boolean -> BOOLEAN, while all 15 of this
        # schema's flag columns are NUMBER(1) (V4:24, V5:13, ...) as 19c
        # requires. With ddl-auto=validate that is a hard startup failure.
        # 21c has no native BOOLEAN, so it agrees with 19c on exactly the
        # thing production depends on.
        image: gvenzl/oracle-xe:21-slim-faststart
        env:
          # Throwaway credentials for an ephemeral container that exists for
          # the length of one job and holds only test data. Not a secret, and
          # deliberately not matching any real environment's values.
          ORACLE_PASSWORD: ci_only_sys_pw
          APP_USER: magti_app
          APP_USER_PASSWORD: ci_only_app_pw
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Oracle-backed tests
        run: mvn -B -e test -Dgroups=oracle
        env:
          ORACLE_DB_URL: jdbc:oracle:thin:@localhost:1521/XEPDB1
          ORACLE_DB_USER: magti_app
          ORACLE_DB_PASSWORD: ci_only_app_pw

      # Surefire truncates the console summary at ~1.5k chars, which cuts the
      # message off before the "Caused by" -- so a failing run says only
      # "Failed to load ApplicationContext" with no reason anywhere in the log.
      # The real stack traces are in target/surefire-reports/*.txt, which
      # nothing was collecting. Echo the root causes into the log (fastest to
      # read) and upload the full set (for anything the grep misses).
      - name: Surefire root causes
        if: always()
        run: |
          shopt -s nullglob
          reports=(target/surefire-reports/*.txt)
          if [ ${#reports[@]} -eq 0 ]; then echo "no surefire reports"; exit 0; fi
          echo "===== distinct root causes ====="
          grep -h -E "^Caused by|^[A-Za-z.]+(Exception|Error):" "${reports[@]}" \
            | sort -u | head -40
          echo "===== head of first report ====="
          head -60 "${reports[0]}"

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-oracle
          path: java-backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn
